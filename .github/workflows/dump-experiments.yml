name: Dump experiments
on:
  push:
    branches:
    - ai/dump-experiments

defaults:
  run:
    shell: bash --noprofile --norc {0}

env:
  DOTNET_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  mac14-rosetta-mono-nolldb:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
    - name: Info and build
      run: |
        set -x
        ls -ld /cores; sysctl kern.coredump kern.corefile
        MONO=$(which mono); echo "MONO=$MONO" >> "$GITHUB_ENV"
        mcs -out:"$RUNNER_TEMP/crash.exe" exp/crash/Program.cs
    - name: Crash under Rosetta, kernel cores
      run: |
        sudo chmod 1777 /cores; ls -ld /cores
        ulimit -c unlimited
        for m in segv failfast; do
          "$MONO" "$RUNNER_TEMP/crash.exe" $m > "$RUNNER_TEMP/$m.log" 2>&1; echo "$m rc=$?"; head -3 "$RUNNER_TEMP/$m.log"
          ls -l /cores
        done
    - name: Hang under Rosetta, SIGABRT for a core
      run: |
        ulimit -c unlimited
        "$MONO" "$RUNNER_TEMP/crash.exe" hang > "$RUNNER_TEMP/hang.log" 2>&1 & PID=$!
        sleep 10; kill -ABRT $PID
        for i in $(seq 1 60); do kill -0 $PID 2>/dev/null || break; sleep 1; done
        kill -0 $PID 2>/dev/null && { echo "still alive after 60s"; kill -KILL $PID; }
        wait $PID; echo "rc=$?"; head -5 "$RUNNER_TEMP/hang.log"; ls -l /cores
    - name: Core usability
      run: |
        f=$(ls -t /cores/core.* | head -1); echo "$f"
        perl -e 'alarm shift; exec @ARGV' 120 lldb -x -b -c "$f" -o 'thread list' -o 'bt' 2>&1 | head -30

  mac-intel-coreclr:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v6
    - name: Install runtimes and build crash app
      run: |
        curl -sSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
        bash "$RUNNER_TEMP/dotnet-install.sh" --channel 3.1 --runtime dotnet --install-dir "$RUNNER_TEMP/dotnet" >/dev/null
        bash "$RUNNER_TEMP/dotnet-install.sh" --channel 8.0 --runtime dotnet --install-dir "$RUNNER_TEMP/dotnet" >/dev/null
        cp -r exp/crash "$RUNNER_TEMP/crash" && cd "$RUNNER_TEMP/crash" && dotnet build -c Release | tail -3
    - name: "Kernel core after chmod: plain C program"
      run: |
        sudo chmod 1777 /cores; ls -ld /cores
        printf 'int main(){*(volatile int*)0=0;return 0;}' > "$RUNNER_TEMP/segv.c" && cc -o "$RUNNER_TEMP/segv" "$RUNNER_TEMP/segv.c"
        ulimit -c unlimited; "$RUNNER_TEMP/segv"; echo "rc=$?"; ls -l /cores
    - name: "Kernel core after chmod: .NET Core 3.1 FailFast with vstest-like env"
      env:
        COMPlus_DbgEnableMiniDump: 1
        COMPlus_DbgEnableElfDumpOnMacOS: 1
        COMPlus_DbgMiniDumpType: 4
        COMPlus_DbgMiniDumpName: ${{ runner.temp }}/dumps/%e_%p_%t_crashdump.dmp
      run: |
        mkdir -p "$RUNNER_TEMP/dumps"; ulimit -c unlimited
        start=$(date +%s)
        "$RUNNER_TEMP/dotnet/dotnet" "$RUNNER_TEMP/crash/bin/Release/netcoreapp3.1/crash.dll" failfast; echo "rc=$? after $(( $(date +%s) - start ))s"
        ls -l /cores "$RUNNER_TEMP/dumps"
    - name: "createdump timing: .NET 8 x64, type 4 vs 2"
      run: |
        for t in 4 2; do
          rm -rf "$RUNNER_TEMP/cd$t"; mkdir -p "$RUNNER_TEMP/cd$t"
          start=$(date +%s)
          DOTNET_DbgEnableMiniDump=1 DOTNET_DbgMiniDumpType=$t DOTNET_DbgMiniDumpName="$RUNNER_TEMP/cd$t/%e_%p.dmp" \
            DOTNET_ReadyToRun=0 DOTNET_TieredPGO=1 \
            "$RUNNER_TEMP/dotnet/dotnet" "$RUNNER_TEMP/crash/bin/Release/net8.0/crash.dll" failfast >/dev/null 2>&1
          echo "type $t: $(( $(date +%s) - start ))s"; ls -l "$RUNNER_TEMP/cd$t"
        done

  windows-wer:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/checkout@v6
    - name: Configure WER LocalDumps
      run: |
        $dumps = "$env:RUNNER_TEMP\dumps"; New-Item -Type Directory -Force $dumps | Out-Null
        $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
        New-Item -Path $key -Force | Out-Null
        New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 2 -Force | Out-Null
        New-ItemProperty -Path $key -Name DumpCount -PropertyType DWord -Value 10 -Force | Out-Null
        New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value $dumps -Force | Out-Null
    - name: Build crash apps
      run: |
        Copy-Item -Recurse exp/crash "$env:RUNNER_TEMP/crash"
        & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo "/out:$env:RUNNER_TEMP\fx64.exe" "$env:RUNNER_TEMP\crash\Program.cs"
        & "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe" /nologo /platform:x86 "/out:$env:RUNNER_TEMP\fx86.exe" "$env:RUNNER_TEMP\crash\Program.cs"
        Push-Location "$env:RUNNER_TEMP/crash"; dotnet build -c Release -f net8.0 | Select-Object -Last 3; Pop-Location
    - name: Crash them
      run: |
        $cases = @(
          @{ Name = 'fx64'; Exe = "$env:RUNNER_TEMP\fx64.exe"; Args = @() },
          @{ Name = 'fx86'; Exe = "$env:RUNNER_TEMP\fx86.exe"; Args = @() },
          @{ Name = 'net8'; Exe = 'dotnet'; Args = @("$env:RUNNER_TEMP\crash\bin\Release\net8.0\crash.dll") }
        )
        foreach ($c in $cases) {
          foreach ($m in 'failfast', 'throw') {
            $a = $c.Args + $m
            & $c.Exe @a 2>&1 | Select-Object -First 2
            "$($c.Name) $m => $LastExitCode"
            Start-Sleep 5
            Get-ChildItem "$env:RUNNER_TEMP\dumps" | Format-Table Name, Length
          }
        }
        $global:LASTEXITCODE = 0
